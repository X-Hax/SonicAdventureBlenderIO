schema_version = "1.0.0"

id = "sonic_adventure_io_dev"
version = "2.999.0"
name = "Sonic Adventure I/O DEV BUILD"
tagline = "Import/Exporter for Sonic Adventure Model, Animation and more"
maintainer = "Justin113D, ItsEasyActually, X-Hax"
type = "add-on"

website = "https://github.com/X-Hax/SonicAdventureBlenderIO"
tags = ["Import-Export"]

blender_version_min = "5.1.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

wheels = [
  "./wheels/colorama-0.4.6-py2.py3-none-any.whl",
]

[permissions]
clipboard = "For copying selected vertex indices"
files = "Importing and exporting files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.venv/",
  "/.vscode/",
  "/.git/",
  "*.bat",
  ".*",
  "*.blend1",
  "*.prod.*",
]